[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interif-scripts"
version = "0.1.0"
description = "Scripts de apoio à organização do InterIF (geração de CSV, envio de e-mails, validação de CPFs e geração de arquivos BOCA)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Daniel Correa Lobato", email = "correalobatodaniel@gmail.com" }]

dependencies = [
    "cpf>=3.0",
    "ruff>=0.4",
    # gerar_etiquetas.py
    "reportlab>=4.0",
    "pillow>=10.0",
    # graficos_equipes.py
    "tabulate>=0.9",
    # normalização de nomes de cursos
    "rapidfuzz>=3.0",
    # gráficos de distribuição
    "matplotlib>=3.8",
    # templates de mala direta
    "jinja2>=3.0",
    # testes
    "pytest>=8.0",
]

[project.scripts]
interif-gerar-csv    = "equipes_interif:main"        # python equipes_interif.py
interif-inscricoes   = "inscricoes_atuais:main"        # python inscricoes_atuais.py
interif-cpf          = "cpf_check:main"               # python cpf_check.py
interif-boca         = "gerar_arquivos_boca:main"     # python gerar_arquivos_boca.py
interif-credenciais  = "enviar_credenciais:main"      # python enviar_credenciais.py
interif-camisetas    = "total_camisetas:main"          # python total_camisetas.py
interif-etiquetas    = "gerar_etiquetas:main"             # python gerar_etiquetas.py
interif-placas       = "gerar_placas:main"                # python gerar_placas.py
interif-graficos      = "graficos_equipes:main"        # python graficos_equipes.py
interif-equipes-especiais = "graficos_equipes:main"    # compatibilidade
interif-mensagem          = "enviar_mensagem:main"          # python enviar_mensagem.py
interif-matriculas        = "verifica_matriculas:main"      # python verifica_matriculas.py
interif-rejeitados        = "emails_rejeitados:main"        # python emails_rejeitados.py

# ── Hatchling: inclui os scripts avulsos (sem __init__.py) ───────────────────
[tool.hatch.build.targets.wheel]
packages = [
    "config.py",
    "interif_core.py",
    "equipes_interif.py",
    "inscricoes_atuais.py",
    "cpf_check.py",
    "gerar_arquivos_boca.py",
    "enviar_credenciais.py",
    "total_camisetas.py",
    "gerar_etiquetas.py",
    "gerar_placas.py",
    "graficos_equipes.py",
    "verifica_matriculas.py",
]

# ── Ruff (linter / formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # linha longa — controlada pelo formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
